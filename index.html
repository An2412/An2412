<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Private Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen transition-colors duration-200" style="background:var(--bg-body);color:var(--text-primary);font-family:'Inter',sans-serif;">

  <!-- Header -->
  <header class="sticky top-0 z-50 px-4 py-3 flex items-center justify-between" style="background:var(--bg-card);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);">
    <div class="flex items-center gap-3">
      <button id="btn-sidebar" class="header-btn" title="Toggle Sidebar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <svg class="w-7 h-7" style="color:var(--accent)" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <h1 class="text-lg font-bold tracking-tight">Super Private Dashboard</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-sound" class="header-btn" title="Toggle Sound">
        <svg id="icon-sound-on" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
        </svg>
        <svg id="icon-sound-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <button id="btn-encrypt" class="header-btn" title="Encryption Settings">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </button>
      <button id="btn-theme" class="header-btn" title="Toggle Theme">
        <svg id="icon-sun" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg id="icon-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
      <button id="btn-add" class="add-btn" title="Add Widget">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span class="hidden sm:inline">Add Widget</span>
      </button>
    </div>
  </header>

  <!-- Toolbar (view modes, snapshots) -->
  <div id="toolbar">
    <button class="toolbar-btn" id="btn-zen" title="Zen Mode (Z)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg>
      Zen
    </button>
    <button class="toolbar-btn" id="btn-timeline" title="Timeline Mode">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Timeline
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" id="btn-save-layout" title="Save Layout Snapshot">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
      Save Layout
    </button>
    <button class="toolbar-btn" id="btn-load-layout" title="Load Layout Snapshot">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 002-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      Load Layout
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" id="btn-bg-gradient" title="Gradient Background">Gradient</button>
    <button class="toolbar-btn" id="btn-bg-particles" title="Particle Background">Particles</button>
    <button class="toolbar-btn" id="btn-bg-waves" title="Wave Background">Waves</button>
    <button class="toolbar-btn" id="btn-bg-aurora" title="Aurora Borealis Background">Aurora</button>
    <button class="toolbar-btn" id="btn-bg-mesh" title="Mesh Gradient Background">Mesh</button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" id="btn-ambient" title="Ambient Screensaver (F6)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      Ambient
    </button>
    <button class="toolbar-btn" id="btn-cursor-trail" title="Toggle Cursor Trail">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      Trail
    </button>
    <div class="toolbar-separator"></div>
    <kbd class="toolbar-hint" style="cursor:default;margin-left:auto;">⌘K Command Palette</kbd>
  </div>

  <!-- App Layout with Sidebar -->
  <div class="app-layout">
    <!-- B1: Sidebar Groups -->
    <aside id="sidebar"></aside>

    <!-- Main Dashboard -->
    <div class="app-main">
      <main id="dashboard" class="dashboard-grid p-4"></main>
    </div>
  </div>

  <!-- FAB for mobile -->
  <button id="fab-add" class="fab hidden" title="Add Widget">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal-content">
      <div class="flex items-center justify-between mb-4">
        <h2 id="modal-title" class="text-lg font-semibold">Add Widget</h2>
        <button id="modal-close" class="header-btn">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Encryption Password Modal -->
  <div id="encrypt-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width:400px;">
      <h2 class="text-lg font-semibold mb-4">Encryption Settings</h2>
      <div id="encrypt-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2"></div>

  <!-- Floating Widget Dock -->
  <div id="widget-dock"></div>

  <!-- App Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
